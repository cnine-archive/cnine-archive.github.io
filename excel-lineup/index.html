<style>
:root{
  --blue:#2d97cf;--blue2:#1688c7;--bg:#f6f8fb;--card:#fff;--text:#152238;
  --muted:#758196;--line:#e4e8ee;--soft:#edf6ff;--red:#ff5966;--gold:#f0a400;
  --shadow:0 8px 28px rgba(15,23,42,.08)
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}
.topbar{height:64px;background:linear-gradient(135deg,#358fc0,#2d9bd1);color:#fff;display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;min-width:0}.brand img{height:28px;width:auto;display:block}
.subtitle{margin-left:12px;color:#fff;font-size:12px;font-weight:700;opacity:.92;text-decoration:none}
.spacer{flex:1}.top-stat{font-size:13px;opacity:.94}
.main{max-width:1180px;margin:auto;padding:30px 20px 70px}
.hero-title h1{font-size:25px;margin:0 0 7px}.hero-title p{margin:0;color:var(--muted);font-size:14px}
.load-panel{background:#fff;border:1px dashed #a9cfe4;border-radius:16px;padding:28px;text-align:center;margin:22px 0;box-shadow:var(--shadow)}
.load-panel h2{margin:0 0 8px}.load-panel p{margin:5px 0 16px;color:var(--muted);line-height:1.6}
.primary{border:0;background:var(--blue2);color:#fff;border-radius:9px;padding:10px 16px;font-weight:800;box-shadow:0 5px 14px rgba(22,136,199,.24)}
.secondary{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;color:#384152}
.hidden{display:none!important}
.season-bar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:24px 0 16px}
.season-pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;scrollbar-width:thin}
.season-pill{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;white-space:nowrap;color:#4b5563}
.season-pill.active{background:var(--blue2);border-color:var(--blue2);color:#fff;font-weight:800}
.season-nav{border:1px solid var(--line);background:#fff;border-radius:9px;width:38px;height:38px}
.season-head{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.season-title-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.season-title-row h2{margin:0;font-size:22px}.season-meta{color:var(--muted);font-size:13px;margin-top:6px}
.season-total{margin-left:auto;text-align:right}.season-total label{display:block;color:var(--muted);font-size:11px}.season-total strong{font-size:25px;color:#111827}
.broadcast-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.broadcast-tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;color:#465267}
.broadcast-tab.active{background:#0ea5e9;color:#fff;border-color:#0ea5e9;font-weight:800}
.section{margin-top:24px}
.section-title{display:flex;align-items:center;gap:9px;margin:0 0 12px;font-size:17px}
.section-title small{font-size:12px;color:var(--muted);font-weight:500}
.category-block{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(15,23,42,.04);margin-bottom:14px}
.category-head{display:flex;align-items:center;margin-bottom:14px}
.category-head h3{margin:0;font-size:15px}.category-head span{margin-left:auto;color:var(--muted);font-size:12px}
.member-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.member-card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px;text-align:center;position:relative;min-width:0;transition:.15s}
.member-card:hover{transform:translateY(-1px);box-shadow:0 7px 20px rgba(15,23,42,.07)}
.avatar-link{display:inline-block;text-decoration:none;color:inherit}
.avatar-link:hover .avatar{transform:scale(1.06);box-shadow:0 0 0 2px rgba(22,136,199,.25)}
.avatar{width:58px;height:58px;margin:0 auto 8px;border-radius:50%;overflow:hidden;background:#edf3f8;display:flex;align-items:center;justify-content:center;color:#758196;font-weight:900;transition:.15s ease}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.member-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-rank{font-size:11px;color:#1688c7;font-weight:800;margin-top:4px}
.member-id{font-size:10px;color:#9aa6b5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.member-money{font-size:12px;font-weight:900;margin-top:7px;font-variant-numeric:tabular-nums}
.member-extra{font-size:10px;color:#f97316;margin-top:3px}
.badge{position:absolute;top:8px;right:8px;font-size:9px;border-radius:999px;padding:3px 6px;font-weight:800}
.badge.guest{background:#fff4e5;color:#d97706}.badge.reward{background:#e9f8ef;color:#188a51}
.detail-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:20px}
.table-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.table-card h3{font-size:15px;margin:0;padding:15px 16px;border-bottom:1px solid var(--line);background:#fafbfc}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 13px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}
th{background:#f5f6f8;color:#667085}th:last-child,td:last-child{text-align:right}
tr:last-child td{border-bottom:0}
.broadcast-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}
.stat-card label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}.stat-card strong{font-size:15px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.db-info{font-size:12px;color:var(--muted);margin-top:10px}
.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;border-radius:10px;padding:12px 16px;z-index:200;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:980px){.member-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.detail-grid{grid-template-columns:1fr}.broadcast-summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
 .top-stat{display:none}.main{padding:22px 10px 50px}.member-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 .member-card{padding:10px 6px}.avatar{width:50px;height:50px}.season-bar{grid-template-columns:auto 1fr auto}
 .season-head{padding:16px}.season-total{width:100%;margin-left:0;text-align:left}.broadcast-summary{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../"><img src="../logo-dark.png" alt="씨나인"></a>
  <a class="subtitle" href="./">엑셀 라인업</a>
  <div class="spacer"></div><div class="top-stat" id="topStat">DB를 불러오는 중...</div>
</header>

<main class="main">
  <section class="hero-title">
    <h1>엑셀 라인업</h1>
    <p>시즌별 참여 멤버, 직급, 기여도 아카이브</p>
  </section>

  <section class="load-panel hidden" id="loadPanel" data-nosnippet>
    <h2>엑셀 라인업 DB 불러오기</h2>
    <p><b>cnine-excel-lineup-db.json</b> 파일을 선택하거나 이 영역에 끌어다 놓으세요.<br>파일은 브라우저 안에서만 읽으며 외부로 전송하지 않습니다.</p>
    <input id="fileInput" type="file" accept="application/json,.json" hidden>
    <button class="primary" id="pickBtn">DB 파일 선택</button>
    <button class="secondary" id="autoBtn">같은 폴더에서 자동 불러오기</button>
    <div class="db-info" id="dbInfo"></div>
  </section>

  <section id="app" class="hidden">
    <div class="season-bar">
      <button class="season-nav" id="prevSeason" aria-label="이전 시즌">‹</button>
      <div class="season-pills" id="seasonPills"></div>
      <button class="season-nav" id="nextSeason" aria-label="다음 시즌">›</button>
    </div>

    <section class="season-head">
      <div class="season-title-row">
        <div>
          <h2 id="seasonTitle">시즌</h2>
          <div class="season-meta" id="seasonMeta"></div>
        </div>
        <div class="season-total">
          <label>시즌 총 매출</label>
          <strong id="seasonRevenue">0</strong>
        </div>
      </div>
      <div class="broadcast-tabs" id="broadcastTabs"></div>
    </section>

    <div class="broadcast-summary" id="broadcastSummary"></div>
    <div id="memberSections"></div>

    <div class="detail-grid">
      <section class="table-card">
        <h3>회차별 매출</h3>
        <table>
          <thead><tr><th>회차</th><th>기간</th><th>매출</th></tr></thead>
          <tbody id="broadcastBody"></tbody>
        </table>
      </section>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={db:null,seasons:[],seasonIndex:0,broadcastId:'all'};
const els={loadPanel:$('#loadPanel'),app:$('#app'),fileInput:$('#fileInput'),seasonPills:$('#seasonPills'),broadcastTabs:$('#broadcastTabs'),memberSections:$('#memberSections')};

function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){return Number.isFinite(Number(v))?Number(v):0}
function money(v){return num(v).toLocaleString()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function showLoadPanel(msg=''){els.loadPanel.classList.remove('hidden');if(msg)$('#dbInfo').textContent=msg}
function normalizeDb(raw){
 if(!raw||!Array.isArray(raw.seasons))throw new Error('cnine-excel-lineup DB 형식이 아닙니다.');
 return raw;
}
function fmtDate(v){
 if(!v)return '-';
 const d=new Date(v);
 if(Number.isNaN(d.getTime()))return String(v);
 return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function categoryLabel(cat){
 return ({
   PLAYER:'플레이어',
   WAITER:'웨이터',
   DIRECTOR:'이사',
   REP:'대표',
   GUEST:'객원',
   MERCENARY:'용병'
 })[cat]||cat||'기타';
}
function categoryOrder(cat){
 return ({
   DIRECTOR:0,
   REP:1,
   PLAYER:2,
   WAITER:3,
   GUEST:4,
   MERCENARY:5
 })[cat]??9;
}
function normalizeProfile(url){
 const s=String(url||'').trim();
 if(!s)return '';
 if(s.startsWith('//'))return `https:${s}`;
 return s;
}
function currentSeason(){return state.seasons[state.seasonIndex]||null}
function currentBroadcast(){
 const season=currentSeason();
 if(!season||state.broadcastId==='all')return null;
 return (season.broadcasts||[]).find(b=>String(b.id)===String(state.broadcastId))||null;
}
function avatar(member){
 const first=String(member.name||member.soopUserId||'?').charAt(0)||'?';
 const src=normalizeProfile(member.profileImageUrl);
 const stationUrl=`https://ch.sooplive.co.kr/${encodeURIComponent(member.soopUserId||'')}`;
 if(!src){
   return `<a class="avatar-link" href="${stationUrl}" target="_blank" rel="noopener noreferrer" title="SOOP 방송국 열기"><div class="avatar">${esc(first)}</div></a>`;
 }
 return `<a class="avatar-link" href="${stationUrl}" target="_blank" rel="noopener noreferrer" title="SOOP 방송국 열기"><div class="avatar"><img src="${esc(src)}" alt="${esc(member.name||'')} 프로필" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('a').innerHTML='<div class=&quot;avatar&quot;>${esc(first)}</div>'"></div></a>`;
}
function restoreHash(){
 const p=new URLSearchParams(location.hash.replace(/^#/,''));
 const seasonNo=p.get('season');
 const idx=state.seasons.findIndex(s=>String(s.seasonNo)===String(seasonNo));
 state.seasonIndex=idx>=0?idx:0;
 state.broadcastId=p.get('broadcast')||'all';
}
function syncHash(){
 const season=currentSeason();if(!season)return;
 const p=new URLSearchParams();p.set('season',String(season.seasonNo));
 if(state.broadcastId!=='all')p.set('broadcast',String(state.broadcastId));
 history.replaceState(null,'',`${location.pathname}${location.search}#${p}`);
}
function loadDb(raw,source){
 state.db=normalizeDb(raw);
 state.seasons=[...state.db.seasons].sort((a,b)=>num(b.seasonNo)-num(a.seasonNo));
 restoreHash();
 if(!currentSeason())state.seasonIndex=0;
 const season=currentSeason();
 if(state.broadcastId!=='all' && !(season?.broadcasts||[]).some(b=>String(b.id)===String(state.broadcastId)))state.broadcastId='all';
 render();
 $('#dbInfo').textContent=`${source} · 시즌 ${state.seasons.length}개 · 멤버 기록 ${num(state.db.stats?.memberRankCount)}개`;
 $('#topStat').textContent=`시즌 ${state.seasons.length}개 · 회차 ${num(state.db.stats?.broadcastCount)}개`;
 els.loadPanel.classList.add('hidden');els.app.classList.remove('hidden');toast('DB를 불러왔습니다.');
}
async function readFile(file){try{loadDb(JSON.parse(await file.text()),file.name)}catch(e){alert('DB 파일을 읽지 못했습니다.\n'+e.message)}}
async function autoLoad({silent=false}={}){
 try{const r=await fetch('./cnine-excel-lineup-db.json',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);loadDb(await r.json(),'cnine-excel-lineup-db.json');return true}
 catch(e){if(!silent)showLoadPanel(`같은 경로의 DB를 불러오지 못했습니다. (${e.message})`);return false}
}
async function init(){
 if(location.protocol==='file:'){showLoadPanel('오프라인 파일 실행 모드입니다. DB JSON 파일을 선택해 주세요.');return}
 if(!await autoLoad({silent:true}))showLoadPanel('같은 경로에서 cnine-excel-lineup-db.json을 찾지 못했습니다. DB 파일을 직접 선택해 주세요.');
}
function renderSeasonPills(){
 els.seasonPills.innerHTML=state.seasons.map((s,i)=>`<button class="season-pill ${i===state.seasonIndex?'active':''}" data-index="${i}">S${num(s.seasonNo)}</button>`).join('');
 $$('.season-pill').forEach(b=>b.onclick=()=>{state.seasonIndex=Number(b.dataset.index);state.broadcastId='all';syncHash();render()});
 const active=$('.season-pill.active');active?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}
function renderBroadcastTabs(season){
 const broadcasts=[...(season.broadcasts||[])].sort((a,b)=>num(a.id)-num(b.id));
 els.broadcastTabs.innerHTML=`<button class="broadcast-tab ${state.broadcastId==='all'?'active':''}" data-id="all">시즌 전체</button>`+
 broadcasts.map(b=>`<button class="broadcast-tab ${String(state.broadcastId)===String(b.id)?'active':''}" data-id="${num(b.id)}">${esc(b.title||`회차 ${b.id}`)}</button>`).join('');
 $$('.broadcast-tab').forEach(b=>b.onclick=()=>{state.broadcastId=b.dataset.id;syncHash();render()});
}
function effectiveDonation(member){
 const broadcast=currentBroadcast();
 if(!broadcast)return num(member.totalDonation);
 return num(broadcast.memberDonations?.[member.soopUserId]);
}
function visibleMembers(season){
 const broadcast=currentBroadcast();
 let rows=[...(season.memberRanks||[])];
 if(broadcast)rows=rows.filter(m=>Object.prototype.hasOwnProperty.call(broadcast.memberDonations||{},m.soopUserId));
 return rows.sort((a,b)=>categoryOrder(a.category)-categoryOrder(b.category)||effectiveDonation(b)-effectiveDonation(a)||String(a.name||'').localeCompare(String(b.name||''),'ko'));
}
function renderMembers(season){
 const members=visibleMembers(season);
 const grouped=new Map();
 for(const m of members){
   const key=m.category||'ETC';
   if(!grouped.has(key))grouped.set(key,[]);
   grouped.get(key).push(m);
 }
 const groups=[...grouped.entries()].sort((a,b)=>categoryOrder(a[0])-categoryOrder(b[0]));
 if(!groups.length){els.memberSections.innerHTML='<div class="empty">해당 회차의 참여자 정보가 없습니다.</div>';return}
 els.memberSections.innerHTML=groups.map(([cat,rows])=>`
  <section class="category-block">
   <div class="category-head"><h3>${esc(categoryLabel(cat))}</h3><span>${rows.length}명</span></div>
   <div class="member-grid">
    ${rows.map(m=>{
      const donation=effectiveDonation(m);
      const extra=!currentBroadcast()&&num(m.additionalDonation)>0?`<div class="member-extra">추가 ${money(m.additionalDonation)} 포함</div>`:'';
      const guest='';
      return `<article class="member-card">
       ${guest}${avatar(m)}
       <div class="member-name">${esc(m.name||'-')}</div>
       <div class="member-rank">${esc(m.rankName||'-')}</div>
       <div class="member-id">${esc(m.soopUserId||'-')}</div>
       <div class="member-money">${money(donation)}</div>${extra}
      </article>`;
    }).join('')}
   </div>
  </section>`).join('');
}
function renderSummary(season){
 const broadcast=currentBroadcast();
 const members=visibleMembers(season);
 const total=broadcast?num(broadcast.totalRevenue):num(season.totalRevenue);
 const start=broadcast?.startAt||season.startAt;
 const end=broadcast?.endAt||season.endAt;
 $('#broadcastSummary').innerHTML=`
  <div class="stat-card"><label>조회 범위</label><strong>${esc(broadcast?.title||'시즌 전체')}</strong></div>
  <div class="stat-card"><label>참여 인원</label><strong>${members.length}명</strong></div>
  <div class="stat-card"><label>기간</label><strong>${esc(fmtDate(start))} - ${esc(fmtDate(end))}</strong></div>
  <div class="stat-card"><label>기여도 합계</label><strong>${money(total)}</strong></div>`;
}
function renderTables(season){
 const broadcasts=[...(season.broadcasts||[])].sort((a,b)=>num(a.id)-num(b.id));
 $('#broadcastBody').innerHTML=broadcasts.length
   ? broadcasts.map(b=>`<tr><td>${esc(b.title||'-')}</td><td>${esc(fmtDate(b.startAt))} - ${esc(fmtDate(b.endAt))}</td><td>${money(b.totalRevenue)}</td></tr>`).join('')
   : '<tr><td colspan="3">데이터 없음</td></tr>';
}
function render(){
 const season=currentSeason();if(!season)return;
 renderSeasonPills();renderBroadcastTabs(season);
 $('#seasonTitle').textContent=season.name||`시즌 ${season.seasonNo}`;
 $('#seasonMeta').textContent=`${fmtDate(season.startAt)} - ${fmtDate(season.endAt)}`;
 $('#seasonRevenue').textContent=money(season.totalRevenue);
 renderSummary(season);renderMembers(season);renderTables(season);
}
// ← 최신 시즌 방향, → 과거 시즌 방향
$('#prevSeason').onclick=()=>{
  if(state.seasonIndex>0){
    state.seasonIndex-=1;
    state.broadcastId='all';
    syncHash();
    render();
  }
};
$('#nextSeason').onclick=()=>{
  if(state.seasonIndex<state.seasons.length-1){
    state.seasonIndex+=1;
    state.broadcastId='all';
    syncHash();
    render();
  }
};
