<style>
:root{
  --blue:#2d97cf;
  --blue2:#1688c7;
  --bg:#f6f8fb;
  --card:#ffffff;
  --text:#152238;
  --muted:#7a879a;
  --line:#e3e8ef;
  --shadow:0 10px 32px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}
a{color:inherit}
.topbar{
  height:64px;
  background:linear-gradient(135deg,#358fc0,#2d9bd1);
  color:#fff;
  display:flex;
  align-items:center;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 12px rgba(0,0,0,.12)
}
.brand{
  display:inline-flex;
  align-items:center;
  min-width:0;
  text-decoration:none;
}
.brand img{height:28px;width:auto;display:block}
.brand small{
  margin-left:12px;
  font-size:12px;
  font-weight:700;
  opacity:.92;
  white-space:nowrap
}
.main{
  width:min(900px,calc(100% - 32px));
  margin:0 auto;
  padding:56px 0 72px
}
.memorial{
  text-align:center
}
.main-image{
  display:block;
  width:min(660px,100%);
  max-height:650px;
  object-fit:contain;
  margin:0 auto;
  border-radius:4px;
  background:#fff;
  box-shadow:var(--shadow)
}
.dates{
  margin-top:23px;
  font-size:17px;
  font-weight:700;
  letter-spacing:.08em;
  color:#435066
}
.divider{
  width:44px;
  height:1px;
  background:#b9c3d0;
  margin:38px auto
}
.archive-section{
  max-width:680px;
  margin:0 auto
}
.archive-title{
  margin:0 0 14px;
  text-align:center;
  font-size:14px;
  color:var(--muted);
  font-weight:700;
  letter-spacing:.08em
}
.archive-links{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px
}
.archive-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:58px;
  padding:14px 16px;
  text-decoration:none;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  color:#27354a;
  font-size:14px;
  font-weight:700;
  transition:border-color .16s,transform .16s,box-shadow .16s
}
.archive-link::after{
  content:"›";
  color:#9aa6b5;
  font-size:21px;
  font-weight:400
}
.archive-link:hover{
  border-color:#9acceb;
  transform:translateY(-1px);
  box-shadow:0 7px 20px rgba(15,23,42,.07)
}
.footer{
  margin-top:38px;
  text-align:center;
  font-size:11px;
  color:#a0a9b7
}

.source-credit{
  margin-top:8px;
  text-align:center;
  font-size:10px;
  color:#a8b1bf;
  letter-spacing:.01em
}

.source-credit a{
  color:#8795a9;
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:color .15s,border-color .15s
}

.source-credit a:hover{
  color:#5f7188;
  border-bottom-color:#9aa8b9
}
.image-fallback{
  display:none;
  width:min(660px,100%);
  min-height:320px;
  margin:0 auto;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  font-size:13px
}
@media(max-width:640px){
  .topbar{padding:0 16px}
  .brand small{font-size:11px;margin-left:9px}
  .main{width:min(100% - 20px,900px);padding:34px 0 48px}
  .archive-links{grid-template-columns:1fr}
  .dates{font-size:15px}
}
.visitor-counter {
  margin-top: 18px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  color: #9aa6b5;
  font-size: 11px;
}

.visitor-counter strong {
  color: #788596;
  font-weight: 700;
}

.visitor-divider {
  margin: 0 3px;
}

<body>
<header class="topbar">
  <a class="brand" href="./" aria-label="씨나인 엑셀 아카이브 메인">

    <!--<small>씨나인 엑셀 아카이브</small>-->
  </a>
</header>

<main class="main">
  <section class="memorial">
    <h1>씨나인 엑셀 아카이브</h1>
    <img
      class="main-image"
      id="mainImage"
      src="./main.png"
      alt="씨나인"
      onerror="this.style.display='none';document.getElementById('imageFallback').style.display='flex'">
    <div class="image-fallback" id="imageFallback">main.png 이미지를 찾을 수 없습니다.</div>
    <div class="dates">2023.12.14 - 2026.07.28</div>
  </section>

  <div class="divider"></div>

  <section class="archive-section" aria-label="아카이브 목록">
    <h1 class="archive-title">ARCHIVE</h1>
    <nav class="archive-links">
      <a class="archive-link" href="./excel-lineup/">엑셀 라인업</a>
      <a class="archive-link" href="./signature-vods/">시그니처 클립</a>
      <a class="archive-link" href="./donation-rank/">통합후원 랭킹 </a>
      <a class="archive-link" href="./excel-donation-rank/">엑셀후원 랭킹</a>
      <a class="archive-link" href="./excel-member-rank/">엑셀플레이어 랭킹</a>
      <a class="archive-link" href="./signature-rank/">시그니처 랭킹</a>
    </nav>
  </section>

  <footer class="footer">CNINE EXCEL ARCHIVE</footer>
  <div class="source-credit">
    Archive based on data from
    <a href="https://cnine.kr/" target="_blank" rel="noopener noreferrer">cnine.kr</a>
  </div>

  <div class="visitor-counter" id="visitorCounter">
    <span>오늘</span>
    <strong id="todayVisitors">-</strong>
  
    <span class="visitor-divider">·</span>
  
    <span>전체</span>
    <strong id="totalVisitors">-</strong>
  </div>
</main>
<script
  data-goatcounter="https://cnine-archive.goatcounter.com/count"
  src="https://gc.zgo.at/count.js">
</script>
<script>
(async () => {
  const counter = document.getElementById("visitorCounter");

  const today = [
    new Date().getFullYear(),
    String(new Date().getMonth() + 1).padStart(2, "0"),
    String(new Date().getDate()).padStart(2, "0")
  ].join("-");

  const base =
    "https://cnine-archive.goatcounter.com/counter/TOTAL.json";

  try {
    const [todayResponse, totalResponse] = await Promise.all([
      fetch(
        `${base}?start=${encodeURIComponent(today)}&end=${encodeURIComponent(today)}`
      ),
      fetch(base)
    ]);

    if (!todayResponse.ok || !totalResponse.ok) {
      throw new Error(
        `GoatCounter 오류: ${todayResponse.status}, ${totalResponse.status}`
      );
    }

    const [todayData, totalData] = await Promise.all([
      todayResponse.json(),
      totalResponse.json()
    ]);

    document.getElementById("todayVisitors").textContent =
      todayData.count ?? "0";

    document.getElementById("totalVisitors").textContent =
      totalData.count ?? "0";
  } catch (error) {
    console.warn("방문자 카운터를 불러오지 못했습니다.", error);
    counter?.remove();
  }
})();
</script>
